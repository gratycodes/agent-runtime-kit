name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: core (no OpenTelemetry installed)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q -rs
      - name: Run demo
        run: python -m agent_runtime.demo

  otel:
    name: with OpenTelemetry extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install package with otel extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,otel]"
      - name: Run pytest (tracing and OTLP export tests included)
        run: pytest -q
      - name: Export example OTLP/JSON traces
        run: python examples/export_otlp_traces.py /tmp/agent_runs.otlp.json
