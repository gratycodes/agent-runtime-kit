[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-runtime-kit"
version = "0.1.0"
description = "Python agent loop with tools, pluggable LLM, memory, and golden evals — portfolio kit for agentic AI systems."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "gratycodes" }]
keywords = ["agents", "llm", "tool-use", "ai", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8.0", "hatchling"]

[project.urls]
Homepage = "https://github.com/gratycodes/agent-runtime-kit"
Repository = "https://github.com/gratycodes/agent-runtime-kit"

[project.scripts]
agent-runtime-demo = "agent_runtime.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_runtime", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
